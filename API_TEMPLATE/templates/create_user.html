<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Crear usuario</title>
	<style>
		:root{--bg:#f5f7fb;--card:#ffffff;--accent:#4f46e5;--muted:#6b7280}
		*{box-sizing:border-box;font-family:Inter,Segoe UI,Arial, sans-serif}
		body{margin:0;background:linear-gradient(180deg,var(--bg),#eef2ff);display:flex;align-items:center;justify-content:center;min-height:100vh}
		.card{width:100%;max-width:520px;background:var(--card);border-radius:12px;padding:28px;box-shadow:0 8px 28px rgba(16,24,40,0.08)}
		h1{margin:0 0 6px;font-size:20px;color:#0f172a}
		p.lead{margin:0 0 20px;color:var(--muted);font-size:14px}
		form{display:grid;gap:12px}
		label{font-size:13px;color:#111827}
		input[type=text],input[type=email],input[type=password],select{width:100%;padding:10px 12px;border:1px solid #e6e9ef;border-radius:8px;font-size:14px;background:#fff}
		.row{display:flex;gap:12px}
		.row .col{flex:1}
		.actions{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:6px}
		button.primary{background:var(--accent);color:#fff;padding:10px 14px;border:none;border-radius:8px;cursor:pointer;font-weight:600}
		button.ghost{background:transparent;border:1px solid #e6e9ef;color:var(--muted);padding:9px 12px;border-radius:8px;cursor:pointer}
		.note{font-size:13px;color:var(--muted);margin-top:8px}
		@media (max-width:520px){.card{padding:18px}}
	</style>
</head>
<body>
	<div class="card">
		<h1>Crear cuenta</h1>
		<p class="lead">Completa los datos para crear un nuevo usuario.</p>
		<form id="createUserForm" action="#" method="post" onsubmit="event.preventDefault(); alert('Usuario creado (simulado). Serás redirigido al login.'); window.location.href='/login';">
			<div class="row">
				<div class="col">
					<label for="first_name">Nombre</label>
					<input id="first_name" name="first_name" type="text" placeholder="Juan" required>
				</div>
				<div class="col">
					<label for="last_name">Apellido</label>
					<input id="last_name" name="last_name" type="text" placeholder="Pérez">
				</div>
			</div>

			<label for="email">Correo electrónico</label>
			<input id="email" name="email" type="email" placeholder="tu@ejemplo.com" required>

			<div class="row">
				<div class="col">
					<label for="password">Contraseña</label>
					<input id="password" name="password" type="password" placeholder="••••••••" required>
				</div>
				<div class="col">
					<label for="confirm_password">Confirmar contraseña</label>
					<input id="confirm_password" name="confirm_password" type="password" placeholder="••••••••" required>
				</div>
			</div>

			<label for="role">Rol</label>
			<select id="role" name="role">
				<option value="user" selected>Usuario</option>
				<option value="admin">Administrador</option>
			</select>

			<div class="actions">
				<button type="submit" class="primary">Crear usuario</button>
				<button type="button" class="ghost" onclick="window.location.href='/tmp/login'">Ir al login</button>
			</div>
			<p class="note">Al crear la cuenta, serás redirigido a la página de inicio de sesión.</p>
		</form>
	</div>
</body>
</html>
